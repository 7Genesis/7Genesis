name: gráfico de contribuições (Galaga)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions fixadas no commit exato: uma atualização do autor não roda aqui sem revisão.
      - name: gera o SVG do Galaga com as contribuições
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # main de 2026-08-01
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'galaga'

      - name: publica os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
